# Required by the org ruleset "Require PR checklist" (BK-1210, ISO-441 / AT-636).
# Fails a pull request whose description is missing the "Logging and secrets"
# section of the PR template, or leaves any of its boxes unticked.
# The template pre-fills only the browser PR form; PRs created with gh, the API
# or other tools skip it, so this check is what makes the section hold everywhere.
name: PR logging and secrets checklist
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]
permissions: {}
jobs:
  checklist:
    # Bots (Dependabot etc.) don't fill templates
    if: github.event.pull_request.user.type != 'Bot'
    runs-on: ubuntu-latest
    steps:
      - name: Check the "Logging and secrets" section
        env:
          BODY: ${{ github.event.pull_request.body }}  # via env, never inline: avoids script injection
        run: |
          section=$(printf '%s\n' "$BODY" | tr -d '\r' | awk '/^## Logging and secrets/{f=1;next} /^## /{f=0} f')
          if [ -z "$section" ]; then
            echo "::error::The PR description has no '## Logging and secrets' section. Copy it from https://github.com/HealthshareAU/.github/blob/main/.github/pull_request_template.md"
            exit 1
          fi
          if printf '%s\n' "$section" | grep -qE '^[[:space:]]*[-*] \[ \]'; then
            echo "::error::Tick every item under '## Logging and secrets', or fix the code so you can. Edit the description; the check re-runs."
            exit 1
          fi
          if ! printf '%s\n' "$section" | grep -qE '^[[:space:]]*[-*] \[[xX]\]'; then
            echo "::error::'## Logging and secrets' has no ticked items."
            exit 1
          fi
          echo "Logging and secrets checklist complete."
